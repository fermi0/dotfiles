# keymap.toml — Yazi 26.8.15 (prepend layer; defaults stay underneath)
# Human docs: ~/Work/Zurnel/Linux/yazi-keybinding.md
# Placeholders: %s=selected paths · %h=hovered · %d=dirnames · %% literal %

# ---------- enter / open ----------
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter dir / smart-open file"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter dir / smart-open file"

# ---------- navigation ----------
[[mgr.prepend_keymap]]
on = [ "J" ]
run  = "plugin jump-to-char"
desc = "Jump to file starting with <char>"

[[mgr.prepend_keymap]]
on = [ "g", "d" ]
run  = 'cd ~/Downloads'
desc = "cd Downloads"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run  = 'cd ~/Documents'
desc = "cd Documents"

[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run  = 'cd ~/Pictures'
desc = "cd Pictures"

[[mgr.prepend_keymap]]
on = [ "g", "v" ]
run  = 'cd ~/Videos'
desc = "cd Videos"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run  = 'cd ~/Music'
desc = "cd Music"

[[mgr.prepend_keymap]]
on = [ "g", "s" ]
run  = 'cd ~/.config'
desc = "cd ~/.config"

# ---------- yank / LIVE transfer (rsync) ----------
[[mgr.prepend_keymap]]
on = [ "Y" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-stash copy %s'
desc = "Stash selection for LIVE copy"

[[mgr.prepend_keymap]]
on = [ "<C-y>" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-commit copy'
desc = "LIVE copy stashed → here"

[[mgr.prepend_keymap]]
on = [ "<A-x>" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-stash move %s'
desc = "Stash selection for LIVE move"

[[mgr.prepend_keymap]]
on = [ "<C-x>" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-commit move'
desc = "LIVE move stashed → here"

[[mgr.prepend_keymap]]
on = [ "y", "n" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-toclip name %s'
desc = "Copy name(s) to clipboard"

[[mgr.prepend_keymap]]
on = [ "y", "p" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-toclip path %s'
desc = "Copy absolute path(s) to clipboard"

[[mgr.prepend_keymap]]
on = [ "y", "d" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-toclip dir %s'
desc = "Copy parent dir(s) to clipboard"

# ---------- create / rename ----------
[[mgr.prepend_keymap]]
on = [ "A" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-create-sudo'
desc = "sudo create dir/file here"

[[mgr.prepend_keymap]]
on = [ "R" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-bulk-rename %s'
desc = "Bulk rename in $EDITOR"

[[mgr.prepend_keymap]]
on = [ "E" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-edit-sudo %h'
desc = "Edit hovered file with sudo"

# ---------- delete / trash ----------
[[mgr.prepend_keymap]]
on = [ "D" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-shred %s'
desc = "SHRED selected (irreversible)"

[[mgr.prepend_keymap]]
on = [ "U" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-trash-restore'
desc = "Restore from Trash to original location"

# ---------- links ----------
[[mgr.prepend_keymap]]
on = [ "L" ]
run  = 'shell --confirm -- $HOME/.local/bin/yz-symlink-stash %s'
desc = "Stash selection for linking"

[[mgr.prepend_keymap]]
on = [ "<A-l>" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-symlink-place'
desc = "Place links: rel/abs/hard menu"

# ---------- convert chord: c ----------
[[mgr.prepend_keymap]]
on = [ "c", "a" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-toaudio %s'
desc = "Convert → audio (opus/mp3/m4a/flac/wav)"

[[mgr.prepend_keymap]]
on = [ "c", "i" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-toimg %s'
desc = "Convert → image (png/jpg/webp/avif + resize)"

[[mgr.prepend_keymap]]
on = [ "c", "z" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-compress %s'
desc = "Compress → zip/7z/tar.{gz,zst,xz}"

[[mgr.prepend_keymap]]
on = [ "c", "x" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-extract %s'
desc = "Extract archive(s)"

[[mgr.prepend_keymap]]
on = [ "c", "m" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-metadata %s'
desc = "Exif/metadata view"

[[mgr.prepend_keymap]]
on = [ "c", "s" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-checksum %s'
desc = "Checksum → clipboard"

[[mgr.prepend_keymap]]
on = [ "c", "t" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-float 900x560 eza --tree --level=3 --icons=auto .'
desc = "Directory tree of cwd"

# ---------- permissions chord: z ----------
[[mgr.prepend_keymap]]
on = [ "z", "m" ]
run  = "plugin chmod"
desc = "chmod interactive (own files)"

[[mgr.prepend_keymap]]
on = [ "z", "M" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-chmod-sudo %s'
desc = "chmod with sudo"

[[mgr.prepend_keymap]]
on = [ "z", "o" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-chown %s'
desc = "chown with sudo"

# ---------- devices / media ----------
[[mgr.prepend_keymap]]
on = [ "M" ]
run  = "plugin mount"
desc = "Mount manager (udisks2)"

[[mgr.prepend_keymap]]
on = [ "<A-m>" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-mount-menu'
desc = "Mount menu + Android MTP"

[[mgr.prepend_keymap]]
on = [ "<A-a>" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-adb %s'
desc = "Android via adb"

[[mgr.prepend_keymap]]
on = [ "K" ]
run  = 'shell --block --confirm -- $HOME/.local/bin/yz-kdeconnect %s'
desc = "KDE Connect"

# ---------- views / preview ----------
[[mgr.prepend_keymap]]
on = [ "T" ]
run  = 'shell --orphan --confirm -- $HOME/.local/bin/yz-term'
desc = "Floating terminal at cwd"

[[mgr.prepend_keymap]]
on = [ "<A-p>" ]
run  = "plugin toggle-pane max-preview"
desc = "Maximize / restore preview"

[[mgr.prepend_keymap]]
on = [ "+" ]
run  = 'plugin zoom +1'
desc = "Zoom preview in"

[[mgr.prepend_keymap]]
on = [ "-" ]
run  = 'plugin zoom -1'
desc = "Zoom preview out"

[[mgr.prepend_keymap]]
on = [ "=" ]
run  = 'plugin zoom reset'
desc = "Reset zoom"

# ---------- search / filter ----------
[[mgr.prepend_keymap]]
on = [ "F" ]
run  = "plugin smart-filter"
desc = "Smart filter (live narrowing)"

# ---------- bookmarks chord: b (yamb) ----------
[[mgr.prepend_keymap]]
on = [ "b", "m" ]
run  = "plugin yamb -- save"
desc = "Bookmark save"

[[mgr.prepend_keymap]]
on = [ "b", "j" ]
run  = "plugin yamb -- jump_by_key"
desc = "Jump by bookmark key"

[[mgr.prepend_keymap]]
on = [ "b", "f" ]
run  = "plugin yamb -- jump_by_fzf"
desc = "Jump fuzzy"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run  = "plugin yamb -- delete_by_key"
desc = "Delete bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "r" ]
run  = "plugin yamb -- rename_by_key"
desc = "Rename bookmark"

# ---------- linemode quick toggles (stable has no composite mode) ----------
[[mgr.prepend_keymap]]
on = [ "g", "l" ]
run  = "linemode size"
desc = "Linemode: size"

[[mgr.prepend_keymap]]
on = [ "g", "t" ]
run  = "linemode mtime"
desc = "Linemode: mtime"

[[mgr.prepend_keymap]]
on = [ "g", "o" ]
run  = "linemode permissions"
desc = "Linemode: permissions"
# (g,p stays cd Pictures)
