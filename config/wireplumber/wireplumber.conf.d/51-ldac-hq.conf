monitor.bluez.properties = {
  bluez5.default.rate = 96000
  bluez5.default.channels = 2
}

monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.E8_26_CF_83_B9_46" }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality = "hq"
      }
    }
  }
  {
    matches = [
      { device.name = "bluez_card.F4_9D_8A_1C_BE_F6" }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality = "hq"
      }
    }
  }
]
