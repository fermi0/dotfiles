# ----------------------------------------------------- 
# name "Disable Animation"
# Disables all animations by setting speed to 0
# ----------------------------------------------------- 

animations {
    enabled = no
    bezier = liner, 1, 1, 1, 1
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.5, 0, 0.99, 0.99
    bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
    animation = windows, 1, 0, liner, slide
    animation = windowsIn, 1, 0, liner, slide
    animation = windowsOut, 1, 0, smoothOut, slide
    animation = windowsMove, 1, 0, wind, slide
    animation = border, 1, 0, liner
    animation = borderangle, 1, 0, liner, loop
    animation = fade, 1, 0, smoothOut
    animation = workspaces, 1, 0, overshot
    animation = workspacesIn, 1, 0, winIn, slide
    animation = workspacesOut, 1, 0, winOut, slide
}
