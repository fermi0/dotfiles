stream.properties = {
    # Maximum resampler quality (0-14, default 4)
    # 14 = Kaiser window, 1024 taps, best anti-aliasing
    resample.quality = 14

    # Kaiser window for resampling (vs default "exp" Blackman)
    # Kaiser has steeper stopband attenuation (~120dB vs ~90dB Blackman)
    resample.window = kaiser

    # No resampling cutoff limit (use full bandwidth)
    resample.cutoff = 0.0

    # No bit-depth conversion noise (F32LE internal)
    dither.noise = 0

    # Use shaped dither when bit reduction is required (best quality)
    dither.method = shaped5

    # Don't disable resampling - allow quality conversions
    resample.disable = false

    # Preserve original channels and position
    channelmix.disable = false

    # Use highest quality bit depth (F32LE) in client connections
    # audio.format = F32LE
}