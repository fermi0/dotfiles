
# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/gruvbox_dark.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.85
# Was 1, which made kitty force the background to fully opaque whenever the
# window was not focused - the cause of terminals looking solid most of the
# time while focused ones looked transparent. 0 keeps background_opacity above
# at all times, so transparency no longer flips with focus.
# Note: kitty only honours a change to this option on config reload if it was
# already enabled in the original config, so a plain reload works here, but a
# restart is the surer option. Effective transparency is also multiplied by the
# opacity_terminal rule in hypr/configs/WindowRules.lua (0.9 focused).
dynamic_background_opacity 0
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

foreground #dddddd
background #000000
cursor #dddddd
